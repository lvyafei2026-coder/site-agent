# Render Blueprint — Web Service（常驻双服务：HTTP 用户线 + 定时后台线）
# 免费档：Free 实例文件系统是临时的（重启即丢），checkpointer 用 memory 后端，
# 单轮流水线不保存跨轮状态，重启无损失。以后要持久化再换 starter + /data 磁盘：
#   plan: starter + disk(mountPath /data, 1GB)
#   MEMORY_BACKEND=sqlite + DATABASE_URL=sqlite:////data/agent.sqlite
# 一个进程同时跑两条线：主线程 uvicorn（/run 用户线）+ 守护线程定时循环（后台热词线）。
# 后台周期由 BACKGROUND_INTERVAL_SEC 控制，<=0 关闭自动循环。部署见 docs/04-runbook.md。
services:
  - type: web
    name: site-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -e .
    startCommand: python -m src.app.main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Asia/Shanghai
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: FLEET_DOMAIN
        sync: false          # 站群主域；子站 / radar / GSC / 联系邮箱都从这里派生
      - key: D1_DATABASE_ID
        sync: false
      - key: KV_NAMESPACE_ID
        sync: false          # 与 radar / console 共用 RADAR_KV（★热词分析必须，agent 直读直写）
      - key: GITHUB_TOKEN
        sync: false
      - key: GH_ORG
        sync: false
      - key: GSC_SA_JSON
        sync: false
      - key: GSC_PROPERTY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false        # GitHub Models 要求 publisher/model 全名，如 openai/gpt-4o-mini
      # 可选：DeepSeek 后台「用量信息」登录态 userToken（不是 API key）。
      # 留空 = /agent 页只显示官方余额；填了才查消费 / 请求次数 / Tokens / 累计消费。
      # 取法见 .env.example；等同只读账单权限，只在 Render Secret 里填，勿入仓库。
      - key: DEEPSEEK_PLATFORM_TOKEN
        sync: false
      # LangSmith 追踪（可选）：TRACING=true 且 API_KEY 非空才真正上报，
      # 任一缺失按关闭处理，不影响 /run 主流程（上报失败只打 warning）。
      - key: LANGSMITH_TRACING
        sync: false        # 填 true 开启
      - key: LANGSMITH_API_KEY
        sync: false        # smith.langchain.com → Settings → API Keys
      - key: LANGSMITH_PROJECT
        value: site-agent
      - key: LANGSMITH_PROJECT_URL
        sync: false        # 项目页地址（非凭据）：smith 项目页 → 复制浏览器地址
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: DEVTO_API_KEY
        sync: false
      - key: MEMORY_BACKEND
        value: memory
      # 后台线自动循环周期（秒），默认 6h 对齐 radar 抓取节奏；<=0 关闭自动循环。
      - key: BACKGROUND_INTERVAL_SEC
        value: "21600"
      # 可选：Render 出口连不上 DuckDuckGo 时，单独给 SERP 抓取换 HTTP 出口。
      # 留空走直连；不影响 KV REST / LLM / GitHub 等其它出站调用。
      - key: SERP_HTTPS_PROXY
        sync: false
      # 直连 DDG 全挂时经公共 Reader 中转换出口（默认开）；设 0 回到纯直连。
      - key: SERP_FALLBACK_READER
        value: "1"
