# Render Blueprint — Web Service（FastAPI 单轮流水线）
# 免费档：Free 实例文件系统是临时的（重启即丢），checkpointer 用 memory 后端，
# 单轮流水线不保存跨轮状态，重启无损失。以后要持久化再换 starter + /data 磁盘：
#   plan: starter + disk(mountPath /data, 1GB)
#   MEMORY_BACKEND=sqlite + DATABASE_URL=sqlite:////data/agent.sqlite
# 调度在外部。部署见 docs/04-runbook.md。
services:
  - type: web
    name: site-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -e .
    startCommand: uvicorn src.app.api.routes:api --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Asia/Shanghai
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: FLEET_DOMAIN
        sync: false          # 站群主域；子站 / radar / GSC / 联系邮箱都从这里派生
      - key: D1_DATABASE_ID
        sync: false
      - key: KV_NAMESPACE_ID
        sync: false          # 与 radar / console 共用 RADAR_KV，键统一 agent: 前缀
      - key: GITHUB_TOKEN
        sync: false
      - key: GH_ORG
        sync: false
      - key: GSC_SA_JSON
        sync: false
      - key: GSC_PROPERTY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false        # GitHub Models 要求 publisher/model 全名，如 openai/gpt-4o-mini
      - key: RADAR_URL
        sync: false
      - key: RADAR_USER
        sync: false
      - key: RADAR_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: DEVTO_API_KEY
        sync: false
      - key: MEMORY_BACKEND
        value: memory
