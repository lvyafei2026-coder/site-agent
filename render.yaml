# Render Blueprint — Web Service（FastAPI 单轮流水线）
# 免费档：Free 实例文件系统是临时的（重启即丢），checkpointer 用 memory 后端，
# 单轮流水线不保存跨轮状态，重启无损失。以后要持久化再换 starter + /data 磁盘：
#   plan: starter + disk(mountPath /data, 1GB)
#   MEMORY_BACKEND=sqlite + DATABASE_URL=sqlite:////data/agent.sqlite
# 调度在外部。部署见 docs/04-runbook.md。
services:
  - type: web
    name: site-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -e .
    startCommand: uvicorn src.app.api.routes:api --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Asia/Shanghai
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: FLEET_DOMAIN
        sync: false          # 站群主域；子站 / radar / GSC / 联系邮箱都从这里派生
      - key: D1_DATABASE_ID
        sync: false
      - key: KV_NAMESPACE_ID
        sync: false          # 与 radar / console 共用 RADAR_KV（★热词分析必须，agent 直读直写）
      - key: GITHUB_TOKEN
        sync: false
      - key: GH_ORG
        sync: false
      - key: GSC_SA_JSON
        sync: false
      - key: GSC_PROPERTY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false        # GitHub Models 要求 publisher/model 全名，如 openai/gpt-4o-mini
      # LangSmith 追踪（可选）：TRACING=true 且 API_KEY 非空才真正上报，
      # 任一缺失按关闭处理，不影响 /run 主流程（上报失败只打 warning）。
      - key: LANGSMITH_TRACING
        sync: false        # 填 true 开启
      - key: LANGSMITH_API_KEY
        sync: false        # smith.langchain.com → Settings → API Keys
      - key: LANGSMITH_PROJECT
        value: site-agent
      - key: LANGSMITH_PROJECT_URL
        sync: false        # 项目页地址（非凭据）：smith 项目页 → 复制浏览器地址
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: DEVTO_API_KEY
        sync: false
      - key: MEMORY_BACKEND
        value: memory
