[project]
name = "site-agent"
version = "0.1.0"
description = "Automated ops agent for toolara.dev site fleet (Render + LangGraph + Cloudflare)"
requires-python = ">=3.11"
authors = [{ name = "lvyafei", email = "hello@toolara.dev" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "langgraph>=0.2.60,<0.4",
    "langgraph-checkpoint-sqlite>=2.0,<3",
    "openai>=1.50",
    "requests>=2.32",
    "apscheduler>=3.10,<4",
    "google-api-python-client>=2.140",
    "google-auth>=2.35",
]

[project.scripts]
site-agent = "site_agent.main:main"
site-agent-approve = "site_agent.resume:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
