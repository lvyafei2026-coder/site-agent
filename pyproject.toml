[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-agent"
version = "0.2.0"
description = "LangGraph production-template site fleet ops agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "lvyafei", email = "hello@toolara.dev" }]
dependencies = [
  "langgraph>=0.2.60,<0.4",
  "langgraph-checkpoint-sqlite>=2.0,<3",
  "langchain-core>=0.3.0",
  "pydantic>=2.0.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "python-dotenv>=1.0.0",
  "openai>=1.50",
  "requests>=2.32",
  "google-api-python-client>=2.140",
  "google-auth>=2.35",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
site-agent = "src.app.main:run"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["test"]
