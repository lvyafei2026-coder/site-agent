<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://{{host}}/{{slug}}.html">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
<script type="application/ld+json">{{jsonld}}</script>
<style>
:root{--fg:#111827;--muted:#5f6673;--line:#e5e7eb;--bg:#fff;--accent:#185fa5}
*{box-sizing:border-box}
body{margin:0;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
header{position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 20px}
header a{color:var(--fg);text-decoration:none;font-weight:500}
main{max-width:760px;margin:0 auto;padding:40px 20px 64px}
h1{font-size:1.9rem;line-height:1.3;margin:0 0 12px}
h2{font-size:1.25rem;margin:36px 0 10px}
p,li{color:#374151}
.faq{border-top:1px solid var(--line);margin-top:40px;padding-top:8px}
footer{border-top:1px solid var(--line);padding:28px 20px;color:var(--muted);font-size:.875rem;text-align:center}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header><a href="/">{{brand}}</a></header>
<main>
  <h1>{{h1}}</h1>
  <p>{{intro}}</p>
  {{sections}}
  <section class="faq"><h2>FAQ</h2>{{faq}}</section>
</main>
<footer>{{brand}} · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></footer>
</body>
</html>
